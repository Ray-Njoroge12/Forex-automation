name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: fx_ai_engine
    env:
      USE_MT5_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: fx_ai_engine/requirements/*.txt
      - name: Install research dependencies
        run: python -m pip install -r requirements/research.txt
      - name: Byte-compile
        run: python -m compileall -q .
      - name: Tests (mock MT5)
        run: python -m pytest -q -p no:cacheprovider
